---
compose_projects:
  - cacic-error-pages
  - crowdsec
  - evcomp
  - prometheus
  - prometheus-node
  - traefik
  - portainer
  - fake-smtp
  - authentik
  - ara
  - keycloak
  - grafana
  - uptime-kuma
  - beszel-dashboard
  - seaweedfs
  - novu
  - cacic-account-manager
  - cacic-voto
  - cacic-email-templates
  - cacic-event-manager
  - glitchtip
  - immich
  - infisical
  - shlink
  - typesense
  - umami-analytics
  - unleash
  - vaultwarden
  - wud-updater

compose_pull_before_up: true
compose_remove_orphans: true

compose_public_paths_moved_to_secrets:
  - traefik/providers/crowdsec.yml

compose_required_secret_overlay_files:
  - portainer/admin-password
  - cacic-account-manager/.env
  - cacic-voto/.env
  - cacic-event-manager/.env
  - novu/.env
  - keycloak/.env
  - seaweedfs/.env
  - seaweedfs/etc/seaweed/filer.toml
  - seaweedfs/etc/seaweed/s3_config.json
  - seaweedfs/etc/seaweed/security.toml
  - traefik/providers/crowdsec.yml

compose_secret_overlay_cleanup_patterns:
  - .env
  - "*.env"
  - "*.secret"
  - "*.secret.*"
  - crowdsec.yml

# The SeaweedFS image drops privileges to uid:gid 1000:1000 before reading
# its bind-mounted configuration files. Keep those files private to that user.
compose_secret_overlay_file_permissions:
  seaweedfs/etc/seaweed/filer.toml:
    owner: "1000"
    group: "1000"
    mode: "0400"
  seaweedfs/etc/seaweed/s3_config.json:
    owner: "1000"
    group: "1000"
    mode: "0400"
  seaweedfs/etc/seaweed/security.toml:
    owner: "1000"
    group: "1000"
    mode: "0400"

compose_secret_overlay_exclude_patterns:
  - acme.json
  - acme-ip.json

compose_retired_paths:
  - cacic-fctapp
  - cacic-fctapp-byebye
