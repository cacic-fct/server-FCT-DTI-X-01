name: Validation

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          import yaml

          failed = False
          for path in sorted(Path(".").rglob("*")):
              if ".git" in path.parts or path.suffix not in {".yml", ".yaml"}:
                  continue
              try:
                  with path.open() as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as exc:
                  failed = True
                  print(f"{path}: {exc}", file=sys.stderr)
          if failed:
              sys.exit(1)
          PY

      - name: Validate Ansible syntax
        run: ansible-playbook --syntax-check site.yml

      - name: Validate Python helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          failed = False
          for path in sorted(Path(".").rglob("*.py")):
              if ".git" in path.parts:
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failed = True
                  print(exc.msg, file=sys.stderr)
          if failed:
              sys.exit(1)
          PY

      - name: Run ansible-lint
        run: ansible-lint --profile min

      - name: Validate Docker Compose projects
        run: ./scripts/validate-compose-config.sh

  promote-production:
    name: Promote main to production branch
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fast-forward production
        run: git push origin HEAD:production
