services:
  email-templates:
    image: ghcr.io/cacic-fct/email-templates:main
    restart: always
    networks:
      - traefik
    labels:
      # Traefik - Proxy
      - "traefik.enable=true"
      # Router
      - "traefik.http.routers.email-templates.entryPoints=web, websecure"
      - "traefik.http.routers.email-templates.rule=Host(`emails.cacic.com.br`)"
      - "traefik.http.routers.email-templates.tls=true"
      # HTTP Service
      - "traefik.http.services.email-templates-svc.loadBalancer.server.port=4321"
      - "traefik.http.services.email-templates-svc.loadBalancer.passHostHeader=true"
      # Middlewares
      - "traefik.http.routers.email-templates.middlewares=email-templates-csp-mw"
      - "traefik.http.middlewares.email-templates-csp-mw.headers.contentSecurityPolicy=default-src 'self' cacic.com.br; img-src *; style-src 'unsafe-inline'; object-src 'none'; script-src 'self' 'unsafe-inline'"

networks:
  traefik:
    external: true
