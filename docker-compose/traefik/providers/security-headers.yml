http:
  middlewares:
    security-headers:
      headers:
        # Keycloak requires iframes to be allowed, so we cannot use the frameDeny option.
        # frameDeny: true
        browserXssFilter: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        sslProxyHeaders:
          X-Forwarded-Proto: https
        contentTypeNosniff: true
        referrerPolicy: "same-origin"
