http:
  middlewares:
    errorpages-mw:
      errors:
        status:
          - "400-401"
          - "403-414"
          - "421"
          - "429"
          - "500-504"
          - "511"
        service: errorpages-svc@docker
        # The error service is called directly, so only browser-loaded assets use /_error-mw/.
        query: "/{status}.html"
