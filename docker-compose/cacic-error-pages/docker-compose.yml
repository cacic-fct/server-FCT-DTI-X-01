services:
  errorpages:
    image: ghcr.io/cacic-fct/error-pages:${ERROR_PAGES_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.errorpages.rule=PathPrefix(`/_error-mw/`)"
      - "traefik.http.routers.errorpages.priority=100"
      - "traefik.http.routers.errorpages.middlewares=errorpages-strip-prefix"
      - "traefik.http.routers.errorpages.service=errorpages-svc"
      - "traefik.http.middlewares.errorpages-strip-prefix.stripPrefix.prefixes=/_error-mw"

      # Middleware Opt-in
      # Não use ele globalmente, para que os serviços possam retornar as próprias respostas 4xx/5xx.
      - "traefik.http.middlewares.errorpages-mw.errors.status=400-401,403-414,421,429,500-504,511"
      - "traefik.http.middlewares.errorpages-mw.errors.service=errorpages-svc"
      - "traefik.http.middlewares.errorpages-mw.errors.query=/{status}.html"
      - "traefik.http.middlewares.errorpages-mw.errors.errorrequestheaders=Accept,Accept-Language"

      # Fallback global para falhas de infraestrutura apenas.
      - "traefik.http.middlewares.errorpages-unavailable.errors.status=502-504"
      - "traefik.http.middlewares.errorpages-unavailable.errors.service=errorpages-svc"
      - "traefik.http.middlewares.errorpages-unavailable.errors.query=/{status}.html"
      - "traefik.http.middlewares.errorpages-unavailable.errors.errorrequestheaders=Accept,Accept-Language"

      # Rota para capturar requisições HTTPS que não correspondem a nenhum serviço.
      - "traefik.http.routers.errorpages-catchall.entrypoints=websecure"
      - "traefik.http.routers.errorpages-catchall.rule=PathPrefix(`/`)"
      - "traefik.http.routers.errorpages-catchall.priority=1"
      - "traefik.http.routers.errorpages-catchall.middlewares=errorpages-not-found"
      - "traefik.http.routers.errorpages-catchall.service=errorpages-svc"
      - "traefik.http.middlewares.errorpages-not-found.errors.status=404"
      - "traefik.http.middlewares.errorpages-not-found.errors.service=errorpages-svc"
      - "traefik.http.middlewares.errorpages-not-found.errors.query=/{status}.html"
      - "traefik.http.middlewares.errorpages-not-found.errors.errorrequestheaders=Accept,Accept-Language"

      - "traefik.http.services.errorpages-svc.loadbalancer.server.port=8080"
      - "traefik.http.services.errorpages-svc.loadbalancer.passhostheader=false"
      - "traefik.http.services.errorpages-svc.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.errorpages-svc.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.errorpages-svc.loadbalancer.healthcheck.timeout=3s"
networks:
  traefik:
    external: true
