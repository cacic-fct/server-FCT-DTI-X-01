services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      VERSION: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api

  sablier:
    image: sablierapp/sablier:1.19.1
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    networks:
      - traefik
      - docker-api
    security_opt:
      - no-new-privileges:true

networks:
  docker-api:
    internal: true
  traefik:
    external: true
