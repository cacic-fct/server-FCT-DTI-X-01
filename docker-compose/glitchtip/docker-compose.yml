x-environment:
  &default-environment
  PORT: 8000
  GLITCHTIP_DOMAIN: https://glitchtip.cacic.dev.br # Change this to your domain
  DEFAULT_FROM_EMAIL: glitchtip@cacic.dev.br # Change this to your email
  CELERY_WORKER_AUTOSCALE: "1,3"  # Scale between 1 and 3 to prevent excessive memory usage. Change it or remove to set it to the number of cpu cores.
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
  ENABLE_USER_REGISTRATION: false

x-depends_on:
  &default-depends_on
  - postgres
  - redis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"  # Consider removing this and setting a password
    restart: unless-stopped
    volumes:
      - /home/shared/docker-data/glitchtip/pg-data:/var/lib/postgresql/data
    networks:
      - default
  redis:
    image: redis
    restart: unless-stopped
    networks:
      - default
  web:
    image: glitchtip/glitchtip
    depends_on: *default-depends_on
    # ports:
    #   - "8000:8000"
    env_file:
      - secrets.env
    environment: *default-environment
    restart: unless-stopped
    volumes: 
      - /home/shared/docker-data/glitchtip/uploads:/code/uploads
    networks:
      - traefik
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.glitchtip.entryPoints=websecure, web"
      - "traefik.http.routers.glitchtip.rule=Host(`glitchtip.cacic.dev.br`)"
      - "traefik.http.routers.glitchtip.tls=true"
      - "traefik.http.routers.glitchtip.tls.certResolver=letsencrypt"
      - "traefik.http.routers.glitchtip.service=glitchtip-svc"
      - "traefik.http.services.glitchtip-svc.loadBalancer.server.port=8000"
  worker:
    image: glitchtip/glitchtip
    command: ./bin/run-celery-with-beat.sh
    depends_on: *default-depends_on
    env_file:
      - secrets.env
    environment: *default-environment
    restart: unless-stopped
    volumes: 
      - /home/shared/docker-data/glitchtip/uploads:/code/uploads
    networks:
      - default
      - smtp
  migrate:
    image: glitchtip/glitchtip
    depends_on: *default-depends_on
    command: ./bin/run-migrate.sh
    env_file:
      - secrets.env
    environment: *default-environment
    networks:
      - default

networks:
  traefik:
    external: true
  smtp:
    external: true
  default:
