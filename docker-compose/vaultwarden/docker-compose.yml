services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    env_file:
      - secrets.env
    environment:
      DOMAIN: "https://senhas.cacic.dev.br" # required when using a reverse proxy; your domain; vaultwarden needs to know it's https to work properly with attachments
      SIGNUPS_ALLOWED: "false" # Deactivate this with "false" after you have created your account so that no strangers can register
      PUSH_ENABLED: "true"
    volumes:
      - /home/shared/docker-data/vaultwarden:/data # the path before the : can be changed
    #    ports:
    #      - 11001:80 # you can replace the 11001 with your preferred port
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.vaultwarden.entryPoints=websecure, web"
      - "traefik.http.routers.vaultwarden.rule=Host(`senhas.cacic.dev.br`)"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certResolver=letsencrypt"
      - "traefik.http.routers.vaultwarden.tls.domains=senhas.cacic.dev.br"
      - "traefik.http.routers.vaultwarden.service=vaultwarden-svc"
      - "traefik.http.services.vaultwarden-svc.loadBalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=errorpages-mw@file, ipwhitelist-mw@file"
      - 'wud.tag.include=^\d+\.\d+\.\d+-alpine$$'
      - 'wud.link.template=https://github.com/dani-garcia/vaultwarden/releases/tag/$${major}.$${minor}.$${patch}'

networks:
  traefik:
    external: true
