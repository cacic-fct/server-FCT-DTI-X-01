# This docker compose setup configures:
# - the Unleash server instance + the necessary backing Postgres database
#
# To learn more about all the parts of Unleash, visit
# https://docs.getunleash.io/get-started/unleash-overview
#
# NOTE: please do not use this configuration for production setups.
# Unleash does not take responsibility for any data leaks or other
# problems that may arise as a result.
#
# This is intended to be used for demo, development, and learning
# purposes only.

services:
  # The Unleash server contains the Unleash configuration and
  # communicates with client SDKs and Unleash Edge
  web:
    image: unleashorg/unleash-server:latest
    #    ports:
    #      - "4242:4242"
    env_file:
      - secrets.env
    environment:
      # This points Unleash to its backing database (defined in the `db` section below)
      # Disable SSL for database connections.
      DATABASE_SSL: "false"
      # Changing log levels:
      LOG_LEVEL: "warn"
      # The default API token is insecure and should not be used in production.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 1s
      timeout: 1m
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.unleash-dashboard.entrypoints=web,websecure
      - traefik.http.routers.unleash-dashboard.rule=Host(`unleash.cacic.com.br`)
      - traefik.http.routers.unleash-dashboard.tls=true
      - traefik.http.routers.unleash-dashboard.middlewares=unleash-dashboard-strip-prefix,noindex@file
      - traefik.http.routers.unleash-dashboard.service=unleash-dashboard-svc
      - traefik.http.middlewares.unleash-dashboard-strip-prefix.stripprefix.prefixes=/dashboard
      - traefik.http.services.unleash-dashboard-svc.loadbalancer.server.port=4242

    networks:
      - default
      - traefik
  db:
    expose:
      - "5432"
    image: postgres:15
    environment:
      # create a database called `db`
      POSTGRES_DB: "db"
      # trust incoming connections blindly (DON'T DO THIS IN PRODUCTION!)
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - /home/shared/docker-data/unleash/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=postgres", "--host=127.0.0.1", "--port=5432"]
      interval: 2s
      timeout: 1m
      retries: 5
      start_period: 10s
networks:
  traefik:
    external: true
