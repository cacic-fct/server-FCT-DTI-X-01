---
- name: Validate human account definitions
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z_][a-z0-9_-]*$')
      - item.uid | int >= 1000
      - item.groups | length > 0
    fail_msg: "Invalid human account definition for {{ item.name | default('unknown') }}."
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Require unique human account names and UIDs
  ansible.builtin.assert:
    that:
      - >-
        server_human_accounts | map(attribute='name') | unique | length ==
        server_human_accounts | length
      - >-
        server_human_accounts | map(attribute='uid') | unique | length ==
        server_human_accounts | length
    fail_msg: Human account names and UIDs must be unique.

- name: Load private human account credentials
  ansible.builtin.include_vars:
    file: "{{ server_human_account_secrets_file }}"
  no_log: true

- name: Validate private human account credentials
  ansible.builtin.assert:
    that:
      - server_human_account_password is string
      - server_human_account_password | length > 0
      - server_human_account_password_hash is match('^\\$6\\$')
    fail_msg: >-
      The private human account credentials file must define a password and a
      SHA-512 password hash.
  no_log: true

- name: Check private authorized key files
  ansible.builtin.stat:
    path: "{{ server_human_account_authorized_keys_root }}/{{ item.name }}/authorized_keys"
  register: server_human_account_authorized_key_files
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Require private authorized key files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) | int > 0
    fail_msg: "Missing or empty private authorized_keys file for {{ item.item.name }}."
  loop: "{{ server_human_account_authorized_key_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

- name: Enforce human account primary groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.uid }}"
    state: present
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enforce human accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: false
    create_home: true
    home: "/home/{{ item.name }}"
    move_home: true
    shell: "{{ server_human_account_shell }}"
    password: "{{ server_human_account_password_hash }}"
    password_expire_max: -1
    password_lock: false
    update_password: always
    expires: -1
    state: present
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Enforce human account SSH directories
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enforce human account authorized keys
  ansible.builtin.copy:
    src: "{{ server_human_account_authorized_keys_root }}/{{ item.name }}/authorized_keys"
    dest: "/home/{{ item.name }}/.ssh/authorized_keys"
    remote_src: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ server_human_accounts }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
