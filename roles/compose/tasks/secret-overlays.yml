---
- name: Find secret compose overlay files
  ansible.builtin.find:
    paths: "{{ server_secrets_source_path }}/docker-compose"
    recurse: true
    file_type: file
    hidden: true
    excludes: "{{ compose_secret_overlay_exclude_patterns | default([]) }}"
  register: secret_compose_files
  no_log: true

- name: Record authoritative secret overlay paths
  ansible.builtin.set_fact:
    secret_compose_relative_paths: >-
      {{ secret_compose_files.files
        | map(attribute='path')
        | map('replace', server_secrets_source_path + '/docker-compose/', '')
        | list }}
  no_log: true

- name: Find deployed secret overlay files
  ansible.builtin.find:
    paths: "{{ docker_compose_root }}"
    recurse: true
    file_type: file
    hidden: true
    patterns: "{{ compose_secret_overlay_cleanup_patterns | default(['.env', '*.env', '*.secret', '*.secret.*']) }}"
  register: deployed_secret_compose_files
  no_log: true

- name: Remove deployed secret overlay files no longer present in Git
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ deployed_secret_compose_files.files }}"
  when: (item.path | replace(docker_compose_root + '/', '')) not in secret_compose_relative_paths
  no_log: true

- name: Create secret overlay directories
  ansible.builtin.file:
    path: "{{ item.path | dirname | replace(server_secrets_source_path + '/docker-compose', docker_compose_root) }}"
    state: directory
    owner: root
    group: "{{ docker_compose_group }}"
    mode: "2770"
  loop: "{{ secret_compose_files.files }}"
  no_log: true

- name: Deploy secret compose overlays
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ item.path | replace(server_secrets_source_path + '/docker-compose', docker_compose_root) }}"
    owner: root
    group: "{{ docker_compose_group }}"
    mode: "0660"
    remote_src: true
  loop: "{{ secret_compose_files.files }}"
  no_log: true

- name: Remove retired compose project containers and networks
  ansible.builtin.shell: |
    set -o pipefail
    container_ids="$(docker ps -aq --filter "label=com.docker.compose.project={{ item }}")"
    if [ -n "$container_ids" ]; then
      docker rm -f $container_ids
      printf '%s\n' "$container_ids"
    fi

    network_ids="$(docker network ls -q --filter "label=com.docker.compose.project={{ item }}")"
    if [ -n "$network_ids" ]; then
      docker network rm $network_ids || true
      printf '%s\n' "$network_ids"
    fi
  args:
    executable: /bin/bash
  register: retired_compose_cleanup
  changed_when: retired_compose_cleanup.stdout | length > 0
  loop: "{{ compose_retired_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: Remove retired compose paths
  ansible.builtin.file:
    path: "{{ docker_compose_root }}/{{ item }}"
    state: absent
  loop: "{{ compose_retired_paths | default([]) }}"

- name: Check required secret compose overlay files
  ansible.builtin.stat:
    path: "{{ docker_compose_root }}/{{ item }}"
  loop: "{{ compose_required_secret_overlay_files | default([]) }}"
  register: required_secret_compose_overlay_files
  when: (compose_required_secret_overlay_files | default([])) | length > 0

- name: Require secret compose overlays used by public config
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
    fail_msg: "Missing required secret compose overlay {{ server_secrets_source_path }}/docker-compose/{{ item.item }}."
  loop: "{{ required_secret_compose_overlay_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: (compose_required_secret_overlay_files | default([])) | length > 0
