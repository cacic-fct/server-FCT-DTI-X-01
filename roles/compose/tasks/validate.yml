---
- name: Validate compose projects
  ansible.builtin.command: docker compose config --quiet
  args:
    chdir: "{{ docker_compose_root }}/{{ item }}"
  loop: "{{ compose_projects }}"
  loop_control:
    label: "{{ docker_compose_root }}/{{ item }}"
  register: compose_project_config_validation
  changed_when: false
  failed_when: false

- name: Print failed compose validation details
  ansible.builtin.debug:
    msg:
      - "Docker Compose config validation failed for {{ docker_compose_root }}/{{ item.item }}"
      - "Exit code: {{ item.rc }}"
      - "stdout: {{ item.stdout | default('') }}"
      - "stderr: {{ item.stderr | default('') }}"
  loop: "{{ compose_project_config_validation.results | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ docker_compose_root }}/{{ item.item }}"

- name: Hand off failed validation projects without blocking deployment telemetry
  ansible.builtin.copy:
    content: >-
      {{ {
        'run_id': lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RUN_ID'),
        'phase': 'validation',
        'projects': compose_project_config_validation.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list,
        'failed_projects': compose_project_config_validation.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list
      } | to_json }}
    dest: "{{ lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RESULTS_PATH') }}"
    mode: "0600"
  when:
    - not ansible_check_mode
    - compose_project_config_validation.results | selectattr('rc', 'ne', 0) | list | length > 0
    - lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RUN_ID') | length > 0
    - lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RESULTS_PATH') | length > 0
  failed_when: false
  changed_when: false
  ignore_unreachable: true

- name: Fail when compose project validation fails
  ansible.builtin.fail:
    msg: >-
      Docker Compose config validation failed for
      {{ compose_project_config_validation.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.
      See the validation stderr above for the exact compose parser error.
  when: compose_project_config_validation.results | selectattr('rc', 'ne', 0) | list | length > 0
