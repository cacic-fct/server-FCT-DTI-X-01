---
- name: Build GitHub App token helper arguments for GHCR
  ansible.builtin.set_fact:
    server_secrets_github_app_ghcr_token_argv: >-
      {{
        [server_secrets_github_app_token_helper_path]
        + (
          (
            server_secrets_github_app_id is defined
            and (server_secrets_github_app_id | string | length > 0)
          )
          | ternary(
            ['--app-id', server_secrets_github_app_id | string],
            ['--app-slug', server_secrets_github_app_slug | string]
          )
        )
        + (
          (
            server_secrets_github_app_installation_id is defined
            and (server_secrets_github_app_installation_id | string | length > 0)
          )
          | ternary(
            ['--installation-id', server_secrets_github_app_installation_id | string],
            ['--repo-url', server_secrets_repo_url | string]
          )
        )
        + ['--private-key', server_secrets_github_app_private_key_path]
      }}
  no_log: true

- name: Create GitHub App token for GHCR
  ansible.builtin.command:
    argv: "{{ server_secrets_github_app_ghcr_token_argv }}"
  register: server_secrets_github_app_ghcr_token
  changed_when: false
  become_user: "{{ server_secrets_github_app_user }}"
  environment:
    HOME: "{{ server_secrets_github_app_home }}"
  no_log: true

- name: Authenticate Docker to GHCR with GitHub App token
  community.docker.docker_login:
    registry_url: ghcr.io
    username: x-access-token
    password: "{{ server_secrets_github_app_ghcr_token.stdout }}"
    reauthorize: true
  no_log: true
