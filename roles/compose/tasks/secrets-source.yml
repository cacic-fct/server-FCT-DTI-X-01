---
- name: Check existing secrets checkout path
  ansible.builtin.stat:
    path: "{{ server_secrets_source_path }}"
  register: server_secrets_source_path_stat
  no_log: true

- name: Ensure secrets checkout parent exists
  ansible.builtin.file:
    path: "{{ server_secrets_source_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check existing secrets checkout metadata
  ansible.builtin.stat:
    path: "{{ server_secrets_source_path }}/.git"
  register: server_secrets_git_metadata
  when: server_secrets_source_path_stat.stat.exists | default(false)
  no_log: true

- name: Read existing secrets checkout origin
  ansible.builtin.command: git remote get-url origin
  args:
    chdir: "{{ server_secrets_source_path }}"
  register: server_secrets_existing_origin
  changed_when: false
  failed_when: false
  when:
    - server_secrets_git_metadata.stat.exists | default(false)
    - server_secrets_git_metadata.stat.isdir | default(false)
  no_log: true

- name: Verify private secrets repository is reachable
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - "{{ server_secrets_repo_url }}"
  changed_when: false
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when: server_secrets_auth_method | default('github_app') != 'github_app'
  no_log: true

- name: Replace non-authoritative local secrets checkout
  ansible.builtin.file:
    path: "{{ server_secrets_source_path }}"
    state: absent
  register: server_secrets_checkout_replaced
  when:
    - server_secrets_replace_local_checkout | default(true)
    - server_secrets_source_path_stat.stat.exists | default(false)
    - >-
      not (server_secrets_git_metadata.stat.isdir | default(false)) or
      (server_secrets_existing_origin.rc | default(1)) != 0 or
      (server_secrets_existing_origin.stdout | default('')) != server_secrets_repo_url
  no_log: true

- name: Ensure existing secrets checkout is owned by the GitHub App user
  ansible.builtin.file:
    path: "{{ server_secrets_source_path }}"
    owner: "{{ server_secrets_github_app_user | default('root') }}"
    group: "{{ server_secrets_github_app_group | default('root') }}"
    recurse: true
  when:
    - server_secrets_auth_method | default('github_app') == 'github_app'
    - server_secrets_source_path_stat.stat.exists | default(false)
    - not (server_secrets_checkout_replaced.changed | default(false))
  no_log: true

- name: Ensure secrets checkout path exists for the GitHub App user
  ansible.builtin.file:
    path: "{{ server_secrets_source_path }}"
    state: directory
    owner: "{{ server_secrets_github_app_user | default('root') }}"
    group: "{{ server_secrets_github_app_group | default('root') }}"
    mode: "0700"
  when: server_secrets_auth_method | default('github_app') == 'github_app'
  no_log: true

- name: Ensure secrets checkout path exists
  ansible.builtin.file:
    path: "{{ server_secrets_source_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: server_secrets_auth_method | default('github_app') != 'github_app'
  no_log: true

- name: Verify private secrets repository is reachable
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --exit-code
      - "{{ server_secrets_repo_url }}"
  changed_when: false
  become_user: "{{ server_secrets_github_app_user }}"
  environment:
    GIT_ASKPASS: "{{ server_secrets_github_app_askpass_path }}"
    GIT_TERMINAL_PROMPT: "0"
    HOME: "{{ server_secrets_github_app_home }}"
  when: server_secrets_auth_method | default('github_app') == 'github_app'
  no_log: true

- name: Clone or update private secrets repository
  ansible.builtin.git:
    repo: "{{ server_secrets_repo_url }}"
    dest: "{{ server_secrets_source_path }}"
    version: "{{ server_secrets_repo_version }}"
    accept_hostkey: true
    force: true
    update: true
  become_user: "{{ server_secrets_github_app_user }}"
  environment:
    GIT_ASKPASS: "{{ server_secrets_github_app_askpass_path }}"
    GIT_TERMINAL_PROMPT: "0"
    HOME: "{{ server_secrets_github_app_home }}"
  when: server_secrets_auth_method | default('github_app') == 'github_app'
  no_log: true

- name: Clone or update private secrets repository without managed GitHub App auth
  ansible.builtin.git:
    repo: "{{ server_secrets_repo_url }}"
    dest: "{{ server_secrets_source_path }}"
    version: "{{ server_secrets_repo_version }}"
    accept_hostkey: true
    force: true
    update: true
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when: server_secrets_auth_method | default('github_app') != 'github_app'
  no_log: true

- name: Remove local files not present in the secrets repository
  ansible.builtin.command: git clean -ffdx
  args:
    chdir: "{{ server_secrets_source_path }}"
  register: server_secrets_git_clean
  changed_when: server_secrets_git_clean.stdout | length > 0
  become_user: "{{ server_secrets_github_app_user }}"
  environment:
    HOME: "{{ server_secrets_github_app_home }}"
  when:
    - server_secrets_auth_method | default('github_app') == 'github_app'
    - server_secrets_clean_untracked_files | default(true)
  no_log: true

- name: Remove local files not present in the secrets repository without managed GitHub App auth
  ansible.builtin.command: git clean -ffdx
  args:
    chdir: "{{ server_secrets_source_path }}"
  register: server_secrets_git_clean
  changed_when: server_secrets_git_clean.stdout | length > 0
  when:
    - server_secrets_auth_method | default('github_app') != 'github_app'
    - server_secrets_clean_untracked_files | default(true)
  no_log: true

- name: Check secrets source
  ansible.builtin.stat:
    path: "{{ server_secrets_source_path }}/docker-compose"
  register: secrets_source

- name: Require secrets source before deploying compose
  ansible.builtin.assert:
    that:
      - secrets_source.stat.isdir | default(false)
    fail_msg: "Missing {{ server_secrets_source_path }}/docker-compose. Clone or sync the private secrets repository first."
