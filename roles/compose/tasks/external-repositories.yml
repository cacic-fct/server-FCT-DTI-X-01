---
- name: Check existing external service repository paths
  ansible.builtin.stat:
    path: "{{ docker_compose_root }}/{{ item.name }}"
  register: external_service_repository_paths
  loop: "{{ compose_external_repositories }}"

- name: Normalize existing external service repository ownership before Git updates
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: directory
    owner: root
    group: "{{ docker_compose_group }}"
    recurse: true
  loop: "{{ external_service_repository_paths.results }}"
  loop_control:
    label: "{{ item.stat.path }}"
  when: item.stat.exists

- name: Clone external service repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ docker_compose_root }}/{{ item.name }}"
    version: "{{ item.version }}"
    force: true
    update: true
  loop: "{{ compose_external_repositories }}"

- name: Apply shared permissions to external service repository roots
  ansible.builtin.file:
    path: "{{ docker_compose_root }}/{{ item.name }}"
    state: directory
    owner: root
    group: "{{ docker_compose_group }}"
    mode: "2775"
  loop: "{{ compose_external_repositories }}"

- name: Apply shared ownership to external service repositories
  ansible.builtin.command:
    cmd: "chown -R root:{{ docker_compose_group }} {{ docker_compose_root }}/{{ item.name }}"
  loop: "{{ compose_external_repositories }}"
  changed_when: false

- name: Apply shared permissions to external service repositories
  ansible.builtin.command:
    cmd: "chmod -R u=rwX,g=rwX,o=rX {{ docker_compose_root }}/{{ item.name }}"
  loop: "{{ compose_external_repositories }}"
  changed_when: false

- name: Preserve setgid on external service repository directories
  ansible.builtin.command:
    cmd: "find {{ docker_compose_root }}/{{ item.name }} -type d -exec chmod g+s {} +"
  loop: "{{ compose_external_repositories }}"
  changed_when: false

- name: Apply external service overlays
  ansible.builtin.copy:
    src: "{{ item.overlay }}/"
    dest: "{{ docker_compose_root }}/{{ item.name }}/"
    owner: root
    group: "{{ docker_compose_group }}"
    mode: "0664"
    directory_mode: "2775"
  loop: "{{ compose_external_repositories }}"
