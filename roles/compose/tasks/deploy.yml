---
- name: Initialize compose project deployment failures
  ansible.builtin.set_fact:
    compose_project_deployment_failures: []

- name: Apply compose projects
  ansible.builtin.include_tasks: deploy-project.yml
  loop: "{{ compose_projects }}"
  loop_control:
    loop_var: compose_project
    label: "{{ compose_project }}"

- name: Hand off this run's compose outcomes to repository health telemetry
  ansible.builtin.copy:
    content: >-
      {{ {
        'run_id': lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RUN_ID'),
        'phase': 'apply',
        'projects': compose_projects,
        'failed_projects': compose_project_deployment_failures | map(attribute='project') | list
      } | to_json }}
    dest: "{{ lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RESULTS_PATH') }}"
    mode: "0600"
  when:
    - not ansible_check_mode
    - lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RUN_ID') | length > 0
    - lookup('ansible.builtin.env', 'GITHUB_DEPLOYMENT_RESULTS_PATH') | length > 0
  failed_when: false
  ignore_unreachable: true
  changed_when: false

- name: Fail after all compose projects have been attempted
  ansible.builtin.fail:
    msg: >-
      Docker Compose deployment failed for the following projects:
      {{ compose_project_deployment_failures | map(attribute='project') | join(', ') }}.
      Per-project diagnostics are available above.
  when: compose_project_deployment_failures | length > 0
