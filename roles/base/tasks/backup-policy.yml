---
- name: Inspect known legacy backup timers, including units still loaded in memory
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ item }}.timer"
  loop:
    - zpaqfranz-backup
    - docker-compose-backup
    - docker-data-backup
  register: legacy_backup_timers
  changed_when: false

- name: Stop and disable known legacy backup timers before removing their units
  ansible.builtin.systemd:
    name: "{{ item.item }}.timer"
    state: stopped
    enabled: false
  loop: "{{ legacy_backup_timers.results }}"
  loop_control:
    label: "{{ item.item }}.timer"
  when: item.stdout | trim != 'not-found'

- name: Ensure no automatic zpaqfranz backup schedules are installed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/cron.d/zpaqfranz-backup
    - /etc/cron.daily/zpaqfranz-backup
    - /etc/systemd/system/zpaqfranz-backup.service
    - /etc/systemd/system/zpaqfranz-backup.timer
    - /etc/systemd/system/zpaqfranz-backup.timer.d
    - /etc/systemd/system/zpaqfranz-backup.service.d
    - /etc/systemd/system/docker-compose-backup.service
    - /etc/systemd/system/docker-compose-backup.timer
    - /etc/systemd/system/docker-compose-backup.timer.d
    - /etc/systemd/system/docker-compose-backup.service.d
    - /etc/systemd/system/docker-data-backup.service
    - /etc/systemd/system/docker-data-backup.timer
    - /etc/systemd/system/docker-data-backup.timer.d
    - /etc/systemd/system/docker-data-backup.service.d

- name: Reload systemd after removing legacy backup units
  ansible.builtin.systemd:
    daemon_reload: true
