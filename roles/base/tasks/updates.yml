---
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades-cacic.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable unattended upgrade automation
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Create systemd timer override directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Configure apt-daily timer
  ansible.builtin.copy:
    src: apt-daily.override.conf
    dest: /etc/systemd/system/apt-daily.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Configure apt-daily-upgrade timer
  ansible.builtin.copy:
    src: apt-daily-upgrade.override.conf
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable apt timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
