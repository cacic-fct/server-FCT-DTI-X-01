---
- name: Check human accounts exist
  ansible.builtin.command:
    argv:
      - id
      - -u
      - "{{ item.name }}"
  register: server_human_account_checks
  changed_when: false
  failed_when: false
  loop: "{{ server_human_accounts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require human accounts to exist
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | int == item.item.uid
    fail_msg: >-
      Human account {{ item.item.name }} must exist with UID
      {{ item.item.uid }}. Current UID:
      {{ item.stdout | default('missing') }}.
  loop: "{{ server_human_account_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read human account records
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item.uid }}"
  register: server_human_account_records
  changed_when: false
  loop: "{{ server_human_accounts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Restore login shell for disabled human accounts
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    shell: "{{ server_human_account_login_shell }}"
  when:
    - item.item.uid in server_human_account_login_uids
    - item.stdout.split(':') | last == '/usr/sbin/nologin'
  loop: "{{ server_human_account_records.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read human account groups
  ansible.builtin.command:
    argv:
      - id
      - -nG
      - "{{ item.name }}"
  register: server_human_account_groups
  changed_when: false
  failed_when: false
  loop: "{{ server_human_accounts | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require expected human account group membership
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.item.required_groups | difference(item.stdout.split())) | length == 0
    fail_msg: >-
      Human account {{ item.item.name }} must belong to groups
      {{ item.item.required_groups | join(', ') }}. Current groups:
      {{ item.stdout | default('missing') }}.
  loop: "{{ server_human_account_groups.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
