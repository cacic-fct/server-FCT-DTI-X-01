---
- name: Validate GitHub deployment telemetry configuration
  ansible.builtin.assert:
    that:
      - ansible_pull_deployment_telemetry_wrapper_path | length > 0
      - ansible_pull_deployment_telemetry_repo_url is match('^(https://github\\.com/|git@github\\.com:).+/.+(\\.git)?$')
      - ansible_pull_deployment_telemetry_environment | length > 0
      - ansible_pull_deployment_telemetry_token_helper_path | length > 0
      - ansible_pull_deployment_telemetry_app_private_key_path | length > 0
      - >-
        (ansible_pull_deployment_telemetry_app_id | default('', true) | string | length > 0) or
        (ansible_pull_deployment_telemetry_app_slug | default('', true) | string | length > 0)
    fail_msg: >-
      GitHub deployment telemetry is enabled but not fully configured. Disable
      ansible_pull_deployment_telemetry_enabled or configure the GitHub App
      token helper, app id/slug, private key, repository, and environment.
  when: ansible_pull_deployment_telemetry_enabled | bool

- name: Ensure network retry helper directory exists
  ansible.builtin.file:
    path: "{{ network_retry_helper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install isolated network retry runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/network_retry.py"
    dest: "{{ network_retry_helper_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the Git executable wrapper with a shared retry deadline
  ansible.builtin.template:
    src: network-git.j2
    dest: "{{ network_retry_git_executable }}"
    owner: root
    group: root
    mode: "0755"

- name: Ensure ansible-pull helper directory exists
  ansible.builtin.file:
    path: "{{ ansible_pull_deployment_telemetry_wrapper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_pull_deployment_telemetry_enabled | bool

- name: Install network retry support beside the telemetry wrapper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/network_retry.py"
    dest: "{{ ansible_pull_deployment_telemetry_wrapper_path | dirname }}/network_retry.py"
    owner: root
    group: root
    mode: "0755"
  when: ansible_pull_deployment_telemetry_enabled | bool

- name: Install GitHub deployment telemetry ansible-pull wrapper
  ansible.builtin.copy:
    src: github-deployment-telemetry-ansible-pull.py
    dest: "{{ ansible_pull_deployment_telemetry_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart ansible-pull timer
  when: ansible_pull_deployment_telemetry_enabled | bool

- name: Configure optional repository health telemetry
  ignore_unreachable: true
  when:
    - ansible_pull_deployment_telemetry_enabled | bool
    - ansible_pull_repository_health_enabled | bool
  block:
    - name: Install repository health reporter
      ansible.builtin.copy:
        src: repository-deployment-health.py
        dest: "{{ ansible_pull_deployment_telemetry_wrapper_path | dirname }}/repository-deployment-health.py"
        owner: root
        group: root
        mode: "0644"

    - name: Install explicit repository health mapping
      ansible.builtin.template:
        src: repository-health.json.j2
        dest: "{{ ansible_pull_repository_health_config_path }}"
        owner: root
        group: root
        mode: "0644"
  rescue:
    - name: Warn without interrupting deployment when health telemetry setup fails
      ansible.builtin.debug:
        msg: Repository health telemetry setup failed; continuing deployment without new telemetry configuration.

- name: Install ansible-pull service
  ansible.builtin.template:
    src: ansible-pull-fct-dti-x-01.service.j2
    dest: /etc/systemd/system/ansible-pull-fct-dti-x-01.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ansible-pull timer

- name: Install ansible-pull timer
  ansible.builtin.template:
    src: ansible-pull-fct-dti-x-01.timer.j2
    dest: /etc/systemd/system/ansible-pull-fct-dti-x-01.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart ansible-pull timer

- name: Enable ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull-fct-dti-x-01.timer
    enabled: true
    state: started
    daemon_reload: true
