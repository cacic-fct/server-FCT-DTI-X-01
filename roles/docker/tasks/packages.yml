---
- name: Install Docker and Compose plugin
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
  register: docker_package_install
  until: docker_package_install is succeeded
  retries: "{{ (network_retry_attempts | int) - 1 }}"
  delay: "{{ network_retry_delay_seconds }}"
