---
- name: Install guarded Docker image prune helper
  ansible.builtin.copy:
    src: docker-system-prune-if-idle
    dest: /usr/local/sbin/docker-system-prune-if-idle
    owner: root
    group: root
    mode: "0755"
  when: docker_system_prune_enabled | bool

- name: Install Docker image prune service
  ansible.builtin.template:
    src: docker-system-prune.service.j2
    dest: /etc/systemd/system/docker-system-prune.service
    owner: root
    group: root
    mode: "0644"
  when: docker_system_prune_enabled | bool

- name: Ensure the ansible-pull service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ansible-pull-fct-dti-x-01.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_system_prune_enabled | bool

- name: Install ansible-pull completion hook for Docker image pruning
  ansible.builtin.template:
    src: ansible-pull-docker-prune.conf.j2
    dest: /etc/systemd/system/ansible-pull-fct-dti-x-01.service.d/docker-system-prune.conf
    owner: root
    group: root
    mode: "0644"
  when: docker_system_prune_enabled | bool

- name: Check for the legacy Docker image prune timer
  ansible.builtin.stat:
    path: /etc/systemd/system/docker-system-prune.timer
  register: docker_system_prune_legacy_timer

- name: Disable the legacy Docker image prune timer
  ansible.builtin.systemd:
    name: docker-system-prune.timer
    enabled: false
    state: stopped
  failed_when: false
  when: docker_system_prune_legacy_timer.stat.exists

- name: Remove the legacy Docker image prune timer unit
  ansible.builtin.file:
    path: /etc/systemd/system/docker-system-prune.timer
    state: absent

- name: Remove disabled Docker image prune configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-system-prune.service
    - /usr/local/sbin/docker-system-prune-if-idle
    - /etc/systemd/system/ansible-pull-fct-dti-x-01.service.d/docker-system-prune.conf
  when: not (docker_system_prune_enabled | bool)

- name: Reload systemd after Docker maintenance configuration
  ansible.builtin.systemd:
    daemon_reload: true
