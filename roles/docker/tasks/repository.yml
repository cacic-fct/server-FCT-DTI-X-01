---
- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    timeout: 30
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_key
  until: docker_apt_key is succeeded
  retries: "{{ (network_retry_attempts | int) - 1 }}"
  delay: "{{ network_retry_delay_seconds }}"

- name: Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true
  register: docker_apt_repository

- name: Update apt cache after Docker repository changes
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_key.changed or docker_apt_repository.changed
  register: docker_apt_cache
  until: docker_apt_cache is succeeded
  retries: "{{ (network_retry_attempts | int) - 1 }}"
  delay: "{{ network_retry_delay_seconds }}"
